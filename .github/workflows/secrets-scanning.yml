# This file is generated by the Terraform module 'github-repository'.
# It is not intended to be edited manually.
name: TruffleHog Secret Scan

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  TruffleHogSecretScan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Secret Scanning
        uses: trufflesecurity/trufflehog@f714bf454f350590f4a24c3ddb1aef02c35bf5b6 # v3.97.5
        with:
          extra_args: --only-verified
